<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock title %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        :root {
            --primary-accent: #fbbf24; /* طلایی */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top left, #1a1a1a, #0a0a0a);
            color: #e5e7eb;
            scroll-behavior: smooth;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: var(--primary-accent);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.06);
        }

        /* Custom Scrollbar for Categories */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Luxury Gradient Text */
        .text-gradient {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Floating Animation for Hero */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .float-anim {
            animation: floating 4s ease-in-out infinite;
        }
    </style>
    

    {%block style_css%}{%endblock%}
</head>
<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass-card border-none rounded-none bg-black/40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-gradient-to-tr from-amber-600 to-amber-400 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/20 rotate-3">
                    <span class="text-2xl">🍽️</span>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white">گراند رستوران</h1>
                    <p class="text-[10px] text-amber-500 font-bold uppercase tracking-widest">Luxury Dining Experience</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button class="glass-card px-5 py-2 rounded-full text-sm font-medium hover:bg-white/10 transition flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                    پیگیری سفارش
                </button>
                <div class="relative group cursor-pointer">
                    <div class="bg-amber-500 p-2.5 rounded-xl shadow-lg shadow-amber-500/30 group-hover:scale-110 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 118 0m-4 10a2 2 0 11-4 0m-4 0a2 2 0 11-4 0m-4 0a2 2 0 11-4 0" />
                        </svg>
                    </div>
                    <span class="absolute -top-2 -right-2 bg-white text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-black">۳</span>
                </div>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock content %}
    

    <!-- Floating Order Bar for Mobile -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white rounded-[2rem] p-4 flex justify-between items-center shadow-2xl z-50 md:hidden">
        <div class="flex flex-col">
            <span class="text-black/50 text-xs font-bold">مجموع سفارش</span>
            <span class="text-black font-black">۸۵۵,۰۰۰ تومان</span>
        </div>
        <button class="bg-black text-white px-8 py-3 rounded-xl font-bold">تکمیل سفارش</button>
    </div>


    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
